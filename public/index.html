<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hala Younes — Portfolio</title>
    <meta name="description" content="Portfolio of Hala Younes." />
    <script>
      // Apply the saved colour theme before the page paints (see src/theme.ts).
      try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="preload" href="assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="assets/fonts/archivo.css" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="theme.js"></script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-header__name" href="index.html">Hala Younes</a>
      <div class="site-header__right">
        <nav aria-label="Main">
          <ul class="tabs-nav">
            <li><a href="index.html" aria-current="page">Projects</a></li>
            <li><a href="info.html">Info</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
        <div id="theme-switch" class="theme-switch" role="group" aria-label="Colour theme"></div>
      </div>
    </header>

    <section class="intro">
      <h1 class="intro__lead">
        A couple of lines about me go here — who I am and what I make.
      </h1>
      <p class="intro__sub">
        A second line with a bit more colour: what I care about, where I'm based, what I'm up to now.
      </p>
    </section>

    <main id="work" class="work">
      <h2 class="visually-hidden">Projects</h2>
      <ol id="project-list" class="project-list">
        <!-- Rows are rendered from src/projects.ts -->
      </ol>
    </main>

    <footer class="footer">
      <p>© 2026 Hala Younes</p>
    </footer>
  </body>
</html>
